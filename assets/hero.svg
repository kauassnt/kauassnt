<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Kauã — Full-Stack Developer</title>
  <desc id="d">Web, SaaS, AI e Automation.</desc>
  <defs>
    <radialGradient id="glowA" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="88%" cy="108%" r="55%">
      <stop offset="0" stop-color="#E7DCCB" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#E7DCCB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="8%" cy="95%" r="45%">
      <stop offset="0" stop-color="#D8B4FE" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#D8B4FE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111116"/>
      <stop offset="1" stop-color="#0B0B0F"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5F5F7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F5F5F7" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#F5F5F7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dotGlow">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="360" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#glowA)"/>
    <rect width="1200" height="360" fill="url(#glowB)"/>
    <rect width="1200" height="360" fill="url(#glowC)"/>

    <!-- curvas quase invisíveis -->
    <g fill="none" stroke="url(#curve)" stroke-width="1">
      <path d="M-20 270 C 260 190, 520 330, 800 240 S 1120 170, 1220 210"/>
      <path d="M-20 300 C 300 240, 560 350, 860 280 S 1130 230, 1220 250"/>
      <path d="M-20 80 C 240 140, 480 30, 760 90 S 1100 150, 1220 100"/>
    </g>

    <!-- luz que se move devagar -->
    <circle cx="600" cy="40" r="170" fill="url(#glowA)" opacity="0.6">
      <animate attributeName="cx" values="520;680;520" dur="26s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </circle>

    <!-- partículas -->
    <g fill="#F5F5F7">
      <circle cx="96"  cy="84"  r="1.4" opacity="0.28"><animate attributeName="opacity" values="0.12;0.38;0.12" dur="9s"  repeatCount="indefinite"/></circle>
      <circle cx="188" cy="262" r="1"   opacity="0.22"><animate attributeName="opacity" values="0.10;0.30;0.10" dur="11s" begin="-3s" repeatCount="indefinite"/></circle>
      <circle cx="264" cy="132" r="1.2" opacity="0.25"><animate attributeName="opacity" values="0.10;0.34;0.10" dur="13s" begin="-6s" repeatCount="indefinite"/></circle>
      <circle cx="342" cy="300" r="1"   opacity="0.20"><animate attributeName="opacity" values="0.08;0.28;0.08" dur="10s" begin="-2s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="58"  r="1.3" opacity="0.26"><animate attributeName="opacity" values="0.10;0.36;0.10" dur="12s" begin="-8s" repeatCount="indefinite"/></circle>
      <circle cx="486" cy="228" r="0.9" opacity="0.18"><animate attributeName="opacity" values="0.08;0.26;0.08" dur="14s" begin="-5s" repeatCount="indefinite"/></circle>
      <circle cx="716" cy="300" r="1.1" opacity="0.22"><animate attributeName="opacity" values="0.10;0.30;0.10" dur="10s" begin="-1s" repeatCount="indefinite"/></circle>
      <circle cx="778" cy="72"  r="1.3" opacity="0.26"><animate attributeName="opacity" values="0.10;0.36;0.10" dur="12s" begin="-7s" repeatCount="indefinite"/></circle>
      <circle cx="870" cy="210" r="1"   opacity="0.20"><animate attributeName="opacity" values="0.08;0.28;0.08" dur="15s" begin="-4s" repeatCount="indefinite"/></circle>
      <circle cx="952" cy="122" r="1.4" opacity="0.28"><animate attributeName="opacity" values="0.12;0.38;0.12" dur="9s"  begin="-6s" repeatCount="indefinite"/></circle>
      <circle cx="1030" cy="282" r="1"  opacity="0.20"><animate attributeName="opacity" values="0.08;0.28;0.08" dur="13s" begin="-9s" repeatCount="indefinite"/></circle>
      <circle cx="1108" cy="76" r="1.2" opacity="0.24"><animate attributeName="opacity" values="0.10;0.34;0.10" dur="11s" begin="-2s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#A78BFA">
      <circle cx="318" cy="196" r="1.6" opacity="0.35"><animate attributeName="opacity" values="0.15;0.5;0.15" dur="10s" begin="-4s" repeatCount="indefinite"/></circle>
      <circle cx="902" cy="296" r="1.6" opacity="0.35"><animate attributeName="opacity" values="0.15;0.5;0.15" dur="12s" begin="-7s" repeatCount="indefinite"/></circle>
    </g>

    <!-- ponto central -->
    <circle cx="600" cy="104" r="18" fill="url(#dotGlow)">
      <animate attributeName="r" values="14;22;14" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="104" r="2.5" fill="#D8B4FE"/>

    <!-- texto -->
    <g text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="600" y="198" font-size="84" font-weight="600" letter-spacing="-2.5" fill="#F5F5F7">Kauã</text>
      <text x="600" y="240" font-size="14" font-weight="500" letter-spacing="5" fill="#A1A1AA">FULL-STACK DEVELOPER</text>
      <text x="600" y="276" font-size="15" font-weight="400" letter-spacing="0.6" fill="#71717A">Web · SaaS · AI · Automation</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="359" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>
</svg>
