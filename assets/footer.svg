<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="t d">
  <title id="t">Built with curiosity.</title>
  <desc id="d">Kauã · Full-Stack Developer</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0B0F"/>
      <stop offset="1" stop-color="#111116"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="100%" r="65%">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="85%" cy="0%" r="45%">
      <stop offset="0" stop-color="#E7DCCB" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#E7DCCB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#F5F5F7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F5F5F7" stop-opacity="0.12"/>
      <stop offset="1"   stop-color="#F5F5F7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="190" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="190" fill="url(#bg)"/>
    <rect width="1200" height="190" fill="url(#glow)"/>
    <rect width="1200" height="190" fill="url(#warm)"/>
    <rect x="300" y="46" width="600" height="1" fill="url(#line)"/>

    <circle cx="600" cy="46" r="12" fill="#A78BFA" fill-opacity="0.18">
      <animate attributeName="r" values="8;14;8" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.22;0.05;0.22" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="46" r="2.2" fill="#D8B4FE"/>

    <g text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="600" y="106" font-size="28" font-weight="500" letter-spacing="-0.5" fill="#F5F5F7">Built with curiosity.</text>
      <text x="600" y="140" font-size="14" font-weight="400" letter-spacing="0.8" fill="#71717A">Kauã · Full-Stack Developer</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="189" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>
</svg>
