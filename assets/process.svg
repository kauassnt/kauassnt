<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" role="img" aria-label="Processo: Ideia → Estrutura → Design → Desenvolvimento → Integrações → Testes → Produção">
<title>Processo de trabalho</title>
<defs>
<linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5F5F7" stop-opacity="0.04"/><stop offset="0.5" stop-color="#F5F5F7" stop-opacity="0.16"/><stop offset="1" stop-color="#F5F5F7" stop-opacity="0.04"/></linearGradient>
<radialGradient id="g"><stop offset="0" stop-color="#A78BFA" stop-opacity="0.5"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
</defs>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="100" y="39.5" width="1000" height="1" fill="url(#l)"/>
<circle cx="100.0" cy="40" r="4" fill="#17171C" stroke="#F5F5F7" stroke-opacity="0.35"/><text x="100.0" y="74" text-anchor="middle" font-size="13" fill="#A1A1AA">Ideia</text><circle cx="266.7" cy="40" r="4" fill="#17171C" stroke="#F5F5F7" stroke-opacity="0.35"/><text x="266.7" y="74" text-anchor="middle" font-size="13" fill="#A1A1AA">Estrutura</text><circle cx="433.3" cy="40" r="4" fill="#17171C" stroke="#F5F5F7" stroke-opacity="0.35"/><text x="433.3" y="74" text-anchor="middle" font-size="13" fill="#A1A1AA">Design</text><circle cx="600.0" cy="40" r="4" fill="#17171C" stroke="#F5F5F7" stroke-opacity="0.35"/><text x="600.0" y="74" text-anchor="middle" font-size="13" fill="#A1A1AA">Desenvolvimento</text><circle cx="766.7" cy="40" r="4" fill="#17171C" stroke="#F5F5F7" stroke-opacity="0.35"/><text x="766.7" y="74" text-anchor="middle" font-size="13" fill="#A1A1AA">Integrações</text><circle cx="933.3" cy="40" r="4" fill="#17171C" stroke="#F5F5F7" stroke-opacity="0.35"/><text x="933.3" y="74" text-anchor="middle" font-size="13" fill="#A1A1AA">Testes</text><circle cx="1100.0" cy="40" r="4" fill="#17171C" stroke="#F5F5F7" stroke-opacity="0.35"/><text x="1100.0" y="74" text-anchor="middle" font-size="13" fill="#A1A1AA">Produção</text>
<g><circle r="14" fill="url(#g)"/><circle r="3" fill="#D8B4FE"/>
<animateMotion dur="14s" repeatCount="indefinite" path="M100 40 H1100" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.55 1"/></g>
</g>
</svg>
