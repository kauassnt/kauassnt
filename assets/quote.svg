<g text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="600" y="92" font-size="28" font-weight="600" letter-spacing="-0.6" fill="#F5F5F7">Bons produtos não precisam parecer complicados.</text>
